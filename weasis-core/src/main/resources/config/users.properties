#
# Weasis RBAC Users Configuration
#
# Format: username=SHA-256(password):Display Name:ROLE[,ROLE2,...]
#
# Password hash can be generated with:
#   echo -n "password" | sha256sum
# or via SimpleAuthenticator.hashPassword("password")
#
# Available roles: ADMIN, RADIOLOGIST, TECHNOLOGIST, VIEWER
# Hierarchy: ADMIN (100) > RADIOLOGIST (80) > TECHNOLOGIST (60) > VIEWER (40) > NONE (0)
#

# Default admin user: admin / admin
admin=a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3:Administrator:ADMIN

