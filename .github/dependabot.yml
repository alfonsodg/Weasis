# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "Type: Enhancement"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "Type: Enhancement"
    commit-message:
      prefix: "chore"
      include: "scope"
